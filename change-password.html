<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password – Crick222</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="index.html" style="color:#9ca3af;font-size:1.1rem;padding:6px"><i class="fa fa-arrow-left"></i></a>
      <a href="index.html" class="logo"><span class="logo-c">C</span>rick<span class="logo-222">222</span></a>
    </div>
    <div class="header-right">
      <div class="wallet"><i class="fa fa-wallet"></i><span class="balance" id="headerBalance">₹0.00</span></div>
    </div>
  </header>
  <div class="page-container">
    <div class="page-title"><i class="fa fa-lock"></i> Change Password</div>
    <div class="card">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input type="password" class="form-input" placeholder="Enter current password" />
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-input" placeholder="Enter new password" />
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-input" placeholder="Re-enter new password" />
      </div>
      <button class="btn-full btn-green" onclick="alert('Password changed successfully!')">
        <i class="fa fa-save"></i> UPDATE PASSWORD
      </button>
    </div>
  </div>
  <nav class="bottom-nav">
