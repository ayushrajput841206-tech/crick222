<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Crick222</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <span class="logo-c">C</span>rick<span class="logo-222">222</span>
    </div>
    <div class="login-title">Sports &amp; Casino Gaming Platform</div>

    <div id="loginError" style="display:none;background:#ef444422;border:1px solid #ef4444;border-radius:8px;padding:10px;font-size:0.8rem;color:#ef4444;margin-bottom:14px;text-align:center;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label"><i class="fa fa-user" style="color:#f59e0b;margin-right:6px"></i>User ID</label>
        <input type="text" id="loginUsername" class="form-input" placeholder="Enter your User ID" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label"><i class="fa fa-lock" style="color:#f59e0b;margin-right:6px"></i>Password</label>
        <div style="position:relative">
          <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:40px" />
          <button type="button" id="togglePwd" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9ca3af;cursor:pointer">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-full btn-green" style="margin-top:6px">
        <i class="fa fa-sign-in-alt"></i> LOGIN
      </button>
    </form>

    <!-- DIVIDER -->
    <div class="wa-divider">
      <span>New to Crick222?</span>
    </div>

    <!-- WHATSAPP BUTTON -->
    <!-- ✏️ TO CHANGE YOUR NUMBER: Replace '919534115630' below with your number.
         Format: 91 = India country code, then your 10-digit mobile number.
         Example: if your number is 9876543210, use: wa.me/919876543210 -->
    <a
      href="https://wa.me/919534115630?text=Hi,%20I%20want%20to%20create%20a%20new%20ID%20for%20crick222"
      target="_blank"
      rel="noopener noreferrer"
      class="wa-btn"
      aria-label="Get New ID via WhatsApp"
    >
      <svg class="wa-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Get New ID via WhatsApp
    </a>

    <div style="text-align:center;margin-top:14px;font-size:0.7rem;color:#4b5563">
      <a href="admin/login.html" style="color:#4b5563">.</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.getUser()) window.location.href = 'index.html';

  document.getElementById('togglePwd').addEventListener('click', function() {
    const inp  = document.getElementById('loginPassword');
    const icon = this.querySelector('i');
    inp.type   = inp.type === 'password' ? 'text' : 'password';
    icon.className = inp.type === 'password' ? 'fa fa-eye' : 'fa fa-eye-slash';
  });

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl    = document.getElementById('loginError');
    const btn      = this.querySelector('button[type=submit]');

    btn.disabled    = true;
    btn.textContent = 'Logging in...';
    errEl.style.display = 'none';

    const res = await Auth.login(username, password);
    if (res.success) {
      Auth.setUser(res.user);
      window.location.href = 'index.html';
    } else {
      errEl.textContent   = res.message || 'Invalid credentials.';
      errEl.style.display = 'block';
      btn.disabled        = false;
      btn.innerHTML       = '<i class="fa fa-sign-in-alt"></i> LOGIN';
    }
  });
</script>
</body>
</html>
